name: Release Hushlor Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify committed release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bootstrap: ${{ steps.version.outputs.bootstrap }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies without changing manifests
        run: npm ci

      - name: Verify tag and committed versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const tag = process.env.RELEASE_TAG ?? '';
          const match = /^v(\d+\.\d+\.\d+)$/.exec(tag);
          if (!match) throw new Error(`Release tag must be v<major>.<minor>.<patch>; received ${tag}`);
          const version = match[1];
          const [major, minor, patch] = version.split('.').map(Number);
          const bootstrap = version === '0.13.0';
          if (!bootstrap && (major < 0 || (major === 0 && (minor < 13 || (minor === 13 && patch < 1))))) {
            throw new Error(`Release ${version} is below the Hushlor downstream baseline v0.13.0`);
          }
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const manifests = [
            ['packages/mcp-server/package.json', '@hushlor/tauri-mcp-server'],
            ['packages/cli/package.json', '@hushlor/tauri-mcp-cli'],
            ['packages/tauri-plugin-mcp-bridge/package.json', '@hushlor/tauri-plugin-mcp-bridge'],
          ];
          for (const [path, expectedName] of manifests) {
            const data = readJson(path);
            if (data.name !== expectedName || data.version !== version) {
              throw new Error(`${path} must be ${expectedName}@${version}`);
            }
          }
          const cli = readJson('packages/cli/package.json');
          if (cli.dependencies?.['@hushlor/tauri-mcp-server'] !== version) {
            throw new Error('CLI must depend on the exact tagged server version');
          }
          const cargo = readFileSync('packages/tauri-plugin-mcp-bridge/Cargo.toml', 'utf8');
          if (!/^name = "tauri-plugin-hushlor-mcp-bridge"$/m.test(cargo) || !new RegExp(`^version = "${version.replaceAll('.', '\\.') }"$`, 'm').test(cargo) || !/^links = "tauri-plugin-hushlor-mcp-bridge"$/m.test(cargo)) {
            throw new Error('Cargo manifest name/version do not match the tagged release');
          }
          const server = readJson('packages/mcp-server/server.json');
          if (server.name !== 'io.github.hushlor/mcp-server-tauri' || server.version !== version || server.packages?.[0]?.identifier !== '@hushlor/tauri-mcp-server' || server.packages?.[0]?.version !== version) {
            throw new Error('MCP Registry metadata does not match the tagged release');
          }
          const rootGemini = readJson('gemini-extension.json');
          const cliGemini = readJson('packages/cli/gemini-extension.json');
          for (const key of ['name', 'description', 'contextFileName']) {
            if (rootGemini[key] !== cliGemini[key]) throw new Error(`CLI Gemini metadata diverges from root for ${key}`);
          }
          if (rootGemini.version !== version || cliGemini.version !== version) {
            throw new Error('Gemini extension metadata does not match the tagged release');
          }
          const cliPlugin = readJson('packages/cli/.claude-plugin/plugin.json');
          const marketplace = readJson('.claude-plugin/marketplace.json');
          const guestPackage = readJson('packages/tauri-plugin-mcp-bridge/guest-js/package.json');
          if (cliPlugin.version !== version || marketplace.metadata?.version !== version) {
            throw new Error('CLI plugin and marketplace metadata do not match the tagged release');
          }
          if (guestPackage.name !== '@hushlor/tauri-plugin-mcp-bridge' || guestPackage.version !== version) {
            throw new Error('Guest JS package metadata does not match the tagged release');
          }
          if (readFileSync('GEMINI.md', 'utf8') !== readFileSync('packages/cli/GEMINI.md', 'utf8')) {
            throw new Error('CLI GEMINI.md must be byte-for-byte identical to the root file');
          }
          execFileSync('git', ['diff', '--check'], { stdio: 'inherit' });
          if (bootstrap) {
            for (const [, expectedName] of manifests) {
              const publishedVersion = execFileSync('npm', ['view', `${expectedName}@${version}`, 'version'], { encoding: 'utf8' }).trim();
              if (publishedVersion !== version) {
                throw new Error(`${expectedName}@${version} must already exist on npm for the bootstrap release`);
              }
            }

            const crateResponse = await fetch(`https://crates.io/api/v1/crates/tauri-plugin-hushlor-mcp-bridge/${version}`, {
              headers: {
                Accept: 'application/json',
                'User-Agent': 'Hushlor/mcp-server-tauri release verification (https://github.com/Hushlor/mcp-server-tauri)',
              },
            });
            if (!crateResponse.ok) {
              throw new Error(`tauri-plugin-hushlor-mcp-bridge@${version} must already exist on crates.io for the bootstrap release`);
            }
          }
          console.log(`version=${version}`);
          NODE
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == "v0.13.0" ]]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

  test-server:
    name: Build and test server
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@hushlor/tauri-mcp-server
      - run: npm run test:unit --workspace=@hushlor/tauri-mcp-server

  test-cli:
    name: Build and test CLI
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace=@hushlor/tauri-mcp-server
      - run: npm run build --workspace=@hushlor/tauri-mcp-cli
      - run: npm run test:cli
      - run: npm run skills:validate --workspace=@hushlor/tauri-mcp-cli

  test-plugin:
    name: Build and test Rust plugin
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build --workspace=@hushlor/tauri-plugin-mcp-bridge
      - run: cargo fmt --check --manifest-path packages/tauri-plugin-mcp-bridge/Cargo.toml
      - run: cargo clippy --locked --manifest-path packages/tauri-plugin-mcp-bridge/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path packages/tauri-plugin-mcp-bridge/Cargo.toml --all-features

  publish-plugin-npm:
    name: Publish plugin bindings to npm
    needs: [verify, test-plugin]
    if: ${{ needs.verify.outputs.bootstrap != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Ensure npm Trusted Publishing support
        run: |
          npm install --global npm@11.5.1
          npm --version
      - run: npm publish --workspace=@hushlor/tauri-plugin-mcp-bridge --access public --provenance

  publish-plugin-cargo:
    name: Publish plugin crate to crates.io
    needs: [verify, test-plugin]
    if: ${{ needs.verify.outputs.bootstrap != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked --manifest-path packages/tauri-plugin-mcp-bridge/Cargo.toml

  publish-server:
    name: Publish server to npm
    needs: [verify, test-server]
    if: ${{ needs.verify.outputs.bootstrap != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Ensure npm Trusted Publishing support
        run: |
          npm install --global npm@11.5.1
          npm --version
      - run: npm publish --workspace=@hushlor/tauri-mcp-server --access public --provenance

  publish-cli:
    name: Publish CLI to npm
    needs: [verify, test-cli, publish-server]
    if: ${{ needs.verify.outputs.bootstrap != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Ensure npm Trusted Publishing support
        run: |
          npm install --global npm@11.5.1
          npm --version
      - run: npm publish --workspace=@hushlor/tauri-mcp-cli --access public --provenance

  create-release:
    name: Create GitHub release
    needs: [verify, test-server, test-cli, test-plugin, publish-plugin-npm, publish-plugin-cargo, publish-server, publish-cli]
    if: ${{ always() && needs.verify.result == 'success' && needs.test-server.result == 'success' && needs.test-cli.result == 'success' && needs.test-plugin.result == 'success' && (needs.verify.outputs.bootstrap == 'true' || (needs.publish-plugin-npm.result == 'success' && needs.publish-plugin-cargo.result == 'success' && needs.publish-server.result == 'success' && needs.publish-cli.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v ver="$VERSION" 'BEGIN { found=0 } /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") { found=1; next } } found { print }' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
